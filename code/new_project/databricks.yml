# This is a Declarative Automation Bundle definition for new_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: new_project
  uuid: 1b12201f-6300-44e2-b753-5354e4bdbcbb

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/pankaj_databricks_outlook.com#ext#@pankajdatabricksoutlook.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pankaj_databricks_outlook.com#ext#@pankajdatabricksoutlook.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: pankajdbws01
      schema: prod
    permissions:
      - user_name: pankaj_databricks_outlook.com#ext#@pankajdatabricksoutlook.onmicrosoft.com
        level: CAN_MANAGE
